plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.windock.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.windock.app'
        minSdk 24
        targetSdk 34
        // CI injects monotonically increasing preview versions; the default
        // upstream Android variant remains untouched.
        versionCode project.hasProperty('windockPreviewVersionCode') ? Integer.parseInt(project.property('windockPreviewVersionCode').toString()) : 4
        versionName project.hasProperty('windockPreviewVersionName') ? project.property('windockPreviewVersionName').toString() : '0.2.2-preview.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            if (project.hasProperty('windockPreviewVersionName')) {
                // Unique Android application ID: does not overwrite original WinDock.
                applicationIdSuffix '.gamepadpreview'
            }
        }
        release {
            minifyEnabled false
            // Release builds remain unsigned until external signing is configured.
            signingConfig signingConfigs.findByName('release')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
